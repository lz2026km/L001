<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L001 · 五代十国兴亡录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--card:#16161f;--card2:#1e1e2e;--text:#f0e6d3;--muted:#8a8a9a;
  --liang:#c9a227;--tang:#e85d04;--jin:#4cc9f0;--han:#7b2d8b;--zhou:#2d6a4f;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;background:var(--card);border-bottom:1px solid #2a2a3a;
  position:sticky;top:0;z-index:100;
}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:2px;color:#d4af37}
.topbar .ver{font-size:12px;color:var(--muted);background:#222;padding:2px 8px;border-radius:4px}
.tabs{display:flex;gap:6px}
.tabs button{
  padding:6px 16px;border:1px solid #333;background:var(--card2);
  color:var(--text);border-radius:6px;cursor:pointer;font-size:14px;
  transition:all .2s;
}
.tabs button.active{background:#d4af37;color:#000;border-color:#d4af37;font-weight:600}
.view{display:none;height:calc(100vh - 60px);overflow:hidden}
.view.active{display:block}

/* ===== MAP VIEW ===== */
#mapView{position:relative}
.map-container{
  position:relative;width:100%;height:calc(100vh - 120px);overflow:hidden;
}
#chinaMap{width:100%;height:100%}
.kingdom{
  cursor:pointer;transition:opacity .3s,filter .3s;
  pointer-events:none;
}
.kingdom.active{pointer-events:all}
.kingdom:hover{filter:brightness(1.4)}
.kingdom-label{
  font-size:11px;fill:#fff;font-weight:600;
  pointer-events:none;text-anchor:middle;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.year-slider{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(10,10,15,.9);padding:12px 24px;
  border-top:1px solid #2a2a3a;display:flex;align-items:center;gap:16px;
}
.year-slider label{font-size:13px;color:var(--muted);min-width:40px}
#yearDisplay{font-size:20px;font-weight:700;color:#d4af37;min-width:50px;text-align:center}
#yearRange{
  flex:1;accent-color:#d4af37;height:6px;cursor:pointer;
  -webkit-appearance:none;background:linear-gradient(to right,#c9a227 var(--pct,0%),#333 var(--pct,0%));
  border-radius:3px;
}
#yearRange::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;
  background:#d4af37;border-radius:50%;cursor:pointer;
}

/* ===== TIMELINE VIEW ===== */
#timelineView{
  overflow-x:auto;overflow-y:auto;padding:0 24px 40px;
  height:calc(100vh - 120px);
}
.timeline-header{
  position:sticky;top:0;background:var(--bg);padding:16px 0 8px;
  z-index:10;border-bottom:1px solid #2a2a3a;margin-bottom:0;
}
.tl-title{font-size:16px;font-weight:700;color:#d4af37;margin-bottom:12px}
.tl-scroll{overflow-x:auto;padding-bottom:20px}
.tl-ruler{
  display:flex;position:relative;height:40px;
  background:linear-gradient(to right,var(--liang),var(--tang),var(--jin),var(--han),var(--zhou));
  border-radius:4px;min-width:1200px;margin-bottom:20px;
}
.tl-era{
  flex:1;text-align:center;font-size:11px;font-weight:600;
  padding:10px 4px;color:rgba(0,0,0,.7);
  border-right:1px solid rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:center;
}
.tl-era:last-child{border-right:none}
.tl-era span{font-size:13px;font-weight:700}
.tl-events{position:relative;min-width:1200px}
.tl-dynasty-row{
  display:flex;align-items:center;margin-bottom:16px;gap:8px;
}
.tl-dynasty-label{
  width:80px;font-size:12px;font-weight:600;text-align:right;
  flex-shrink:0;padding-right:8px;border-right:2px solid;
}
.tl-dynasty-track{
  flex:1;position:relative;height:28px;background:#1a1a25;border-radius:4px;
}
.tl-bar{
  position:absolute;height:16px;top:6px;border-radius:3px;
  cursor:pointer;transition:filter .2s;display:flex;align-items:center;
  padding:0 8px;font-size:11px;font-weight:600;color:rgba(0,0,0,.7);
  white-space:nowrap;overflow:hidden;
}
.tl-bar:hover{filter:brightness(1.3)}
.tl-event-dot{
  position:absolute;width:12px;height:12px;border-radius:50%;
  top:8px;transform:translateX(-50%);cursor:pointer;
  border:2px solid #fff;z-index:2;
}
.tl-event-dot.war{background:#e63946}
.tl-event-dot.found{background:#2a9d8f}
.tl-event-dot.destroy{background:#555}
.tl-event-dot.political{background:#457b9d}
.tl-event-dot:hover{transform:translateX(-50%) scale(1.5)}

/* ===== DETAIL PANEL ===== */
.detail-panel{
  position:fixed;top:0;right:-480px;width:460px;height:100vh;
  background:var(--card);border-left:1px solid #2a2a3a;
  transition:right .4s cubic-bezier(.4,0,.2,1);z-index:200;
  overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.5);
}
.detail-panel.open{right:0}
.detail-header{
  padding:20px 24px 16px;border-bottom:1px solid #2a2a3a;
  position:sticky;top:0;background:var(--card);z-index:1;
}
.detail-close{
  float:right;background:none;border:none;color:var(--muted);
  font-size:24px;cursor:pointer;line-height:1;
}
.detail-close:hover{color:var(--text)}
.detail-name{font-size:24px;font-weight:700;margin-bottom:4px}
.detail-subtitle{font-size:13px;color:var(--muted);margin-bottom:8px}
.detail-period{
  display:inline-block;padding:3px 12px;border-radius:20px;
  font-size:12px;font-weight:600;
}
.detail-body{padding:20px 24px}
.detail-section{margin-bottom:24px}
.detail-section h3{
  font-size:13px;font-weight:700;color:#d4af37;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:1px;
}
.detail-section p{font-size:14px;line-height:1.8;color:#c8c8d8}
.detail-rulers{list:none}
.detail-rulers li{
  padding:8px 12px;background:#1a1a25;border-radius:6px;
  margin-bottom:6px;display:flex;justify-content:space-between;
  font-size:13px;
}
.detail-rulers .ruler-name{font-weight:600}
.detail-rulers .ruler-years{color:var(--muted)}
.detail-timeline{position:relative;padding-left:16px;border-left:2px solid #333}
.detail-tl-item{
  position:relative;padding:0 0 16px;font-size:13px;line-height:1.6;
}
.detail-tl-item::before{
  content:'';position:absolute;left:-21px;top:4px;
  width:8px;height:8px;border-radius:50%;background:#d4af37;
}
.detail-tl-item .year{color:#d4af37;font-weight:600}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:150;
}
.overlay.show{opacity:1;pointer-events:auto}

/* ===== YEAR BADGE ===== */
.year-events{
  position:absolute;right:24px;top:80px;width:200px;
  background:rgba(22,22,31,.95);border:1px solid #2a2a3a;
  border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;
}
.year-events h4{font-size:12px;color:#d4af37;margin-bottom:8px}
.year-event-item{
  padding:6px 0;border-bottom:1px solid #1e1e2e;font-size:12px;
  cursor:pointer;color:var(--text);
}
.year-event-item:hover{color:#d4af37}
.year-event-item:last-child{border-bottom:none}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .detail-panel{width:100%;right:-100%}
  .year-events{right:8px;width:160px;font-size:11px}
  .topbar h1{font-size:14px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>L001 · 五代十国兴亡录</h1>
  <div class="tabs">
    <button class="active" onclick="switchView('map')">🗺️ 地图</button>
    <button onclick="switchView('timeline')">📜 时间轴</button>

  <span class="ver">v0.1</span>
</div>

<!-- ===== MAP VIEW ===== -->
<div id="mapView" class="view active">

      <!-- 长江 -->

      <g id="gLaterZhou" class="kingdom" data-kingdom="LaterZhou" opacity="0">

      <!-- 后蜀(934-965) - 四川 -->

    <!-- 年份事件浮窗 -->

  <div class="year-slider">

    <div class="tl-title">📜 五代十国时间轴（907-960）</div>

    <div class="tl-ruler">

</div>

<!-- OVERLAY -->

<!-- DETAIL PANEL -->

<script>
// ============ DATA ============
const KINGDOMS = {
  LaterLiang:{
    name:'后梁',fullName:'后梁',color:'#c9a227',
    period:'907-923',capital:'汴梁(开封)',

      {year:912,title:'朱温遇弑',desc:'朱温被次子朱友珪刺杀，朱友珪即帝位'},
      {year:913,title:'朱友贞夺位',desc:'朱友贞联合杨师厚进伐，夺取帝位'},
      {year:915,title:'魏州之战',desc:'梁军在魏州惨败，河北三镇尽失'},
      {year:923,title:'后唐灭后梁',desc:'李存勖率军攻入汴梁，梁末帝自杀，后梁亡'}
    ]
  },
  LaterTang:{
    name:'后唐',fullName:'后唐',color:'#e85d04',
    period:'923-936',capital:'洛阳',
    start:923,end:936,
    rulers:[
      {name:'李存勖/唐庄宗',years:'923-926'},
      {name:'李嗣源/唐明宗',years:'926-933'},
      {name:'李从厚/唐闵帝',years:'933-934'},
      {name:'李从珂/唐末帝',years:'934-936'}
    ],

// ============ MAP FUNCTIONS ============
let currentYear = 907;

function updateMap(year) {
  currentYear = year;
  document.getElementById('yearDisplay').textContent = year;
  
  // Update slider fill
  const pct = ((year - 907) / (960 - 907)) * 100;
  document.getElementById('yearRange').style.setProperty('--pct', pct + '%');
  
  // Update kingdom visibility
  Object.keys(KINGDOMS).forEach(key => {
    const k = KINGDOMS[key];
    const el = document.getElementById('g' + key);
    if (!el) return;
    if (year >= k.start && year <= k.end) {
      el.style.opacity = '0.85';
      el.classList.add('active');
    } else {
      el.style.opacity = '0';
      el.classList.remove('active');
    }
  });
  
  // Update Liao visibility (always shown when relevant)
  const liaoEl = document.getElementById('gLiao');
  if (liaoEl) liaoEl.style.opacity = (year >= 907 && year <= 960) ? '0.5' : '0';
  
  // Update year label
  const label = getYearLabel(year);
  document.getElementById('yearLabel').textContent = label;
  
  // Show year events
  showYearEvents(year);
}

function getYearLabel(year) {
  if (year === 907) return '后梁建立，五代开始';
  if (year === 923) return '后唐灭后梁';
  if (year === 925) return '后唐灭前蜀';
  if (year === 934) return '后晋灭后唐，后蜀建立';
  if (year === 936) return '后晋建立';
  if (year === 937) return '南唐代吴';
  if (year === 943) return '南唐灭闽';
  if (year === 945) return '南唐灭闽，楚国内乱';
  if (year === 947) return '契丹灭晋，后汉建立';
  if (year === 951) return '后周代汉，北汉建立';
  if (year === 954) return '高平之战';
  if (year === 958) return '后周夺淮南';
  if (year === 960) return '陈桥兵变，北宋建立';
  return '';
}

function showYearEvents(year) {
  const panel = document.getElementById('yearEvents');
  const list = document.getElementById('yearEventsList');
  const events = [];
  
  Object.values(KINGDOMS).forEach(k => {
    k.events.forEach(e => {
      if (e.year === year) events.push(e);
    });
  });
  
  if (events.length === 0) {
    panel.style.display = 'none';
    return;
  }
  
  panel.style.display = 'block';
  panel.querySelector('h4').textContent = `📌 ${year}年大事`;
  list.innerHTML = events.map(e => 
    `<div class="year-event-item" onclick="openDetailByEvent('${e.title}')">⚔️ ${e.title}<br><span style="color:#888;font-size:11px">${e.desc}</span></div>`
  ).join('');
}

// ============ CLICK HANDLERS ============
document.querySelectorAll('.kingdom').forEach(g => {
  g.addEventListener('click', () => {
    const key = g.dataset.kingdom;
    if (key) openDetail(key);
  });
});

document.getElementById('yearRange').addEventListener('input', e => {
  updateMap(parseInt(e.target.value));
});

function switchView(view) {
  document.querySelectorAll('.tabs button').forEach((b,i) => {
    b.classList.toggle('active', (view==='map'&&i===0)||(view==='timeline'&&i===1));
  });
  document.getElementById('mapView').classList.toggle('active', view==='map');
  document.getElementById('timelineView').classList.toggle('active', view==='timeline');
  if (view === 'timeline') renderTimeline();
}

function openDetail(key) {
  const k = KINGDOMS[key];
  if (!k) return;
  
  document.getElementById('detailName').textContent = k.name;
  document.getElementById('detailSubtitle').textContent = k.fullName + ' · ' + k.capital;
  
  const periodEl = document.getElementById('detailPeriod');
  periodEl.textContent = k.period + '年';
  periodEl.style.cssText = `background:${k.color}22;color:${k.color};border:1px solid ${k.color}44`;
  
  document.getElementById('detailHistory').textContent = k.history;
  
  const rulersEl = document.getElementById('detailRulers');
  rulersEl.innerHTML = k.rulers.map(r => 
    `<li><span class="ruler-name">${r.name}</span><span class="ruler-years">${r.years}</span></li>`
  ).join('');
  
  const tlEl = document.getElementById('detailTimeline');
  tlEl.innerHTML = k.events.map(e => 
    `<div class="detail-tl-item"><span class="year">${e.year}年</span> ${e.title}：${e.desc}</div>`
  ).join('');
  
  document.getElementById('overlay').classList.add('show');
  document.getElementById('detailPanel').classList.add('open');
}

function openDetailByEvent(title) {
  // Find kingdom by event title
  for (const [key, k] of Object.entries(KINGDOMS)) {
    const evt = k.events.find(e => e.title === title);
    if (evt) { openDetail(key); return; }
  }
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('detailPanel').classList.remove('open');
}

// ============ TIMELINE ============
function renderTimeline() {
  const container = document.getElementById('tlEvents');
  const width = 1200; // px per 50 years
  const totalYears = 960 - 907;
  const scale = x => ((x - 907) / totalYears) * 100;
  
  let html = '';
  
  // Five dynasties row
  const fiveDy = [
    {name:'后梁',start:907,end:923,color:'#c9a227'},
    {name:'后唐',start:923,end:936,color:'#e85d04'},
    {name:'后晋',start:936,end:947,color:'#4cc9f0'},
    {name:'后汉',start:947,end:951,color:'#7b2d8b'},
    {name:'后周',start:951,end:960,color:'#2d6a4f'}
  ];
  
  html += '<div class="tl-dynasty-row">';
  html += '<div class="tl-dynasty-label" style="color:#d4af37">五代</div>';
  html += '<div class="tl-dynasty-track">';
  fiveDy.forEach(d => {
    const l = scale(d.start);
    const w = scale(d.end) - l;
    html += `<div class="tl-bar" style="left:${l}%;width:${w}%;background:${d.color}" onclick="openDetailByName('${d.name}')">${d.name}</div>`;
  });
  html += '</div></div>';
  
  // Ten kingdoms
  const tenKingdoms = [
    {name:'前蜀',start:907,end:925,color:'#e63946'},
    {name:'后蜀',start:934,end:965,color:'#f4a261'},
    {name:'吴',start:902,end:937,color:'#2a9d8f'},
    {name:'南唐',start:937,end:975,color:'#2196F3'},
    {name:'吴越',start:907,end:978,color:'#e9c46a'},
    {name:'闽',start:909,end:945,color:'#d62828'},
    {name:'楚',start:907,end:951,color:'#90be6d'},
    {name:'南汉',start:917,end:971,color:'#457b9d'},
    {name:'荆南',start:924,end:963,color:'#9d8189'},
    {name:'北汉',start:951,end:979,color:'#6d597a'}
  ];
  
  tenKingdoms.forEach(k => {
    const l = scale(k.start);
    const w = Math.max(scale(k.end) - l, 1);
    html += '<div class="tl-dynasty-row">';
    html += `<div class="tl-dynasty-label" style="color:${k.color}">${k.name}</div>`;
    html += `<div class="tl-dynasty-track">`;
    html += `<div class="tl-bar" style="left:${l}%;width:${w}%;background:${k.color}44;color:${k.color};border:1px solid ${k.color}" onclick="openDetailByName('${k.name}')">${k.name}</div>`;
    html += '</div></div>';
  });
  
  // Events dots
  html += '<div style="position:relative;height:80px;margin-top:20px">';
  html += '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">⚔️ 重大事件（点击查看详情）</div>';
  const allEvents = [];
  Object.entries(KINGDOMS).forEach(([key, k]) => {
    k.events.forEach(e => {
      allEvents.push({...e, kingdom:key, kName:k.name, color:k.color});
    });
  });
  allEvents.sort((a,b) => a.year - b.year);
  allEvents.forEach(e => {
    const x = scale(e.year);
    const isWar = e.title.includes('战') || e.title.includes('伐') || e.title.includes('攻');
    const isFound = e.title.includes('建') && (e.title.includes('国') || e.title.includes('朝') || e.title.includes('帝'));
    const isDestroy = e.title.includes('灭') || e.title.includes('亡');
    const dotClass = isWar ? 'war' : isFound ? 'found' : isDestroy ? 'destroy' : 'political';
    html += `<div class="tl-event-dot ${dotClass}" style="left:${x}%;top:${20 + (allEvents.indexOf(e)%3)*15}px" title="${e.year} ${e.title}" onclick="openDetailByName('${e.kName}')"></div>`;
  });
  html += '</div>';
  
  container.innerHTML = html;
  
  // Ruler marks
  let rulerHtml = '<div class="tl-ruler" style="margin-top:16px">';
  for (let y = 907; y <= 960; y += 5) {
    const x = scale(y);
    rulerHtml += `<div style="position:absolute;left:${x}%;top:0;font-size:10px;color:var(--muted);transform:translateX(-50%)">${y}</div>`;
  }
  rulerHtml += '</div>';
  container.innerHTML += rulerHtml;
}

function openDetailByName(name) {
  const map = {
    '后梁':'LaterLiang','后唐':'LaterTang','后晋':'LaterJin',
    '后汉':'LaterHan','后周':'LaterZhou','前蜀':'FormerShu',
    '后蜀':'LaterShu','吴':'Wu','南唐':'SouthernTang',
    '吴越':'Wuyue','闽':'Min','楚':'Chu','南汉':'SouthernHan',
    '荆南':'Jingnan','北汉':'NorthernHan'
  };
  if (map[name]) openDetail(map[name]);
}

// ============ INIT ============
updateMap(907);
</script>
